name: Mobile App Interception

on:
  workflow_dispatch:

jobs:
  run-challenge:
    runs-on: ubuntu-latest 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install mitmproxy
        run: pip install mitmproxy

      - name: Extract Launch Activity
        id: find_activity
        run: |
          BUILD_TOOLS=$(find $ANDROID_SDK_ROOT/build-tools/ -maxdepth 1 -type d | sort -r | head -n 1)
          APK_PATH="./base-patched.apk"
          ACTIVITY_NAME=$("$BUILD_TOOLS/aapt2" dump badging "$APK_PATH" | grep "launchable-activity" | sed -n "s/.*name='\([^']\+\)'.*/\1/p")
          echo "activity_name=$ACTIVITY_NAME" >> "$GITHUB_OUTPUT"

      - name: Create Interaction Script
        run: |
          cat << 'EOF' > emulator_script.sh
          #!/bin/bash
          # No 'set -e' here so a single failed tap doesn't kill the whole run
          
          PACKAGE_NAME="newway.open.chatgpt.ai.chat.bot.free"
          ACTIVITY="${{ steps.find_activity.outputs.activity_name }}"

          echo "Waiting for boot..."
          adb wait-for-device
          
          # Start mitmdump only NOW to save idle RAM
          mitmdump -w network_traffic.mitm & 
          
          # Wait for the property to hit 1
          until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == "1" ]; do sleep 5; done
          
          echo "Settling..."
          sleep 15

          echo "Bypassing System UI Overlays..."
          # Use keyevents instead of taps where possible (lighter on CPU)
          adb shell input keyevent 4 # Back button
          sleep 2
          adb shell input keyevent 82 # Menu/Unlock
          sleep 2

          echo "Launching App..."
          adb shell am start -S -n "$PACKAGE_NAME/$ACTIVITY"
          sleep 25

          echo "Automated Interactions..."
          # We use generic percentages/coordinates for a standard 1080x1920
          adb shell input tap 200 800 
          sleep 5
          for i in {1..4}; do
            adb shell input tap 540 1700 # Tap bottom center (Continue)
            sleep 3
          done

          echo "Capturing Final Proof..."
          adb shell screencap -p /sdcard/screenshot.png
          adb pull /sdcard/screenshot.png ./final_screenshot.png
          adb logcat -d > emulator.log
          EOF
          chmod +x emulator_script.sh

      - name: Run Emulator (Ultra-Light Config)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27 # API 27 is the 'Lightweight' king for CI
          target: google_apis
          arch: x86
          force-avd-creation: true
          # Dropped to 1280MB RAM to ensure the Runner never hits OOM 137
          emulator-options: >
            -no-window 
            -no-audio 
            -no-boot-anim 
            -memory 1280 
            -http-proxy http://127.0.0.1:8080 
            -gpu swiftshader_indirect
          disable-animations: true
          script: ./emulator_script.sh

      - name: Upload All Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: challenge-debug-pack
          path: |
            *.png
            *.mitm
            *.log
