name: Mobile App Interception Challenge

on:
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  run-challenge:
    runs-on: macos-latest # macOS is more stable for Android Emulators in Actions
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Interception Tools
        run: |
          pip install mitmproxy
          # Start mitmdump in background to catch all queries
          mitmdump -w network_traffic.mitm & 
          echo "Proxy server started on port 8080"

      - name: Extract Launch Activity
        id: find_activity
        run: |
          # Locate aapt2 in the Android SDK
          AAPT2_PATH=$(find $ANDROID_SDK_ROOT/build-tools/ -name aapt2 | sort -r | head -n 1)
          APK_PATH="./base-patched.apk"
          
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK not found at $APK_PATH"
            exit 1
          fi

          # Get the activity name
          ACTIVITY_NAME=$($AAPT2_PATH dump badging "$APK_PATH" | grep "launchable-activity" | sed -n "s/.*name='\([^']\+\)'.*/\1/p")
          echo "activity_name=$ACTIVITY_NAME" >> "$GITHUB_OUTPUT"
          echo "Target Activity: $ACTIVITY_NAME"

      - name: Create Interaction Script
        run: |
          cat << 'EOF' > emulator_script.sh
          #!/bin/bash
          set -e
          PACKAGE_NAME="newway.open.chatgpt.ai.chat.bot.free"
          ACTIVITY="${{ steps.find_activity.outputs.activity_name }}"

          echo "Waiting for emulator boot..."
          adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done;'
          
          echo "Dismissing System UI popups..."
          adb shell input tap 500 580 
          sleep 2

          echo "Launching App: $PACKAGE_NAME"
          adb shell am start -n "$PACKAGE_NAME/$ACTIVITY"
          sleep 10 # Give it extra time to load and send initial queries

          # Interacting with the UI (Dismiss and Continue)
          echo "Performing UI automated taps..."
          adb shell input tap 200 800 # Dismiss
          sleep 2
          for i in {1..4}; do
            adb shell input tap 500 900 # Continue
            sleep 1
          done

          # Capture the required proof
          echo "Capturing screenshot..."
          adb shell screencap /sdcard/screenshot.png
          adb pull /sdcard/screenshot.png ./final_screenshot.png
          
          echo "Operations complete."
          EOF
          chmod +x emulator_script.sh

      - name: Run Emulator & Intercept
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          # THE TWIST: We route all emulator traffic through our mitmproxy
          emulator-options: "-no-window -no-audio -no-boot-anim -http-proxy http://127.0.0.1:8080"
          disable-animations: true
          script: ./emulator_script.sh

      - name: Upload Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: challenge-outputs
          path: |
            final_screenshot.png
            network_traffic.mitm
