name: Mobile App Interception Challenge

on:
  workflow_dispatch:

jobs:
  run-challenge:
    runs-on: ubuntu-latest 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Interception Tools
        run: |
          pip install mitmproxy
          # Start mitmdump in background
          mitmdump -w network_traffic.mitm & 
          echo "Proxy server active on port 8080"

      - name: Extract Launch Activity
        id: find_activity
        run: |
          BUILD_TOOLS=$(find $ANDROID_SDK_ROOT/build-tools/ -maxdepth 1 -type d | sort -r | head -n 1)
          AAPT2_PATH="$BUILD_TOOLS/aapt2"
          APK_PATH="./base-patched.apk"
          
          if [ ! -f "$APK_PATH" ]; then echo "APK Missing"; exit 1; fi

          ACTIVITY_NAME=$($AAPT2_PATH dump badging "$APK_PATH" | grep "launchable-activity" | sed -n "s/.*name='\([^']\+\)'.*/\1/p")
          echo "activity_name=$ACTIVITY_NAME" >> "$GITHUB_OUTPUT"

      - name: Create Interaction Script
        run: |
          cat << 'EOF' > emulator_script.sh
          #!/bin/bash
          set -e
          PACKAGE_NAME="newway.open.chatgpt.ai.chat.bot.free"
          ACTIVITY="${{ steps.find_activity.outputs.activity_name }}"

          echo "Waiting for boot completion..."
          adb wait-for-device
          # Simple check for boot property
          until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == "1" ]; do
            sleep 5
          done
          
          echo "Booted. Letting system settle for 10s..."
          sleep 10

          echo "Clearing system dialogs..."
          adb shell input tap 500 600 # Tap 'Wait'
          sleep 2
          adb shell input keyevent 4   # Press Back
          sleep 1

          echo "Starting App: $PACKAGE_NAME"
          adb shell am start -S -n "$PACKAGE_NAME/$ACTIVITY"
          
          echo "Waiting for app load..."
          sleep 20

          echo "Current Window Focus:"
          adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp'

          echo "Executing Challenge UI Taps..."
          adb shell input tap 200 800 
          sleep 3
          for i in {1..4}; do
            adb shell input tap 500 900 
            sleep 2
          done

          echo "Capturing proof..."
          adb shell screencap /sdcard/screenshot.png
          adb pull /sdcard/screenshot.png ./final_screenshot.png
          
          echo "Dumping logcat for debug..."
          adb logcat -d > emulator_logs.log
          EOF
          chmod +x emulator_script.sh

      - name: Run Emulator (Optimized Resources)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          # Memory 1536 is the 'Goldilocks' zone for Ubuntu runners to avoid OOM 137
          emulator-options: >
            -no-window 
            -no-audio 
            -no-boot-anim 
            -memory 1536 
            -http-proxy http://127.0.0.1:8080 
            -gpu swiftshader_indirect 
            -prop dalvik.vm.heapsize=256m
          disable-animations: true
          script: ./emulator_script.sh

      - name: Upload Results & Debug Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: challenge-final-results
          path: |
            final_screenshot.png
            network_traffic.mitm
            emulator_logs.log
