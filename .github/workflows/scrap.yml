name: Mobile App Interception Challenge

on:
  workflow_dispatch:

jobs:
  run-challenge:
    runs-on: ubuntu-latest 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Interception Tools
        run: |
          pip install mitmproxy
          # Start mitmdump in background to catch all queries
          mitmdump -w network_traffic.mitm & 
          echo "Proxy server active on port 8080"

      - name: Extract Launch Activity
        id: find_activity
        run: |
          BUILD_TOOLS=$(find $ANDROID_SDK_ROOT/build-tools/ -maxdepth 1 -type d | sort -r | head -n 1)
          AAPT2_PATH="$BUILD_TOOLS/aapt2"
          APK_PATH="./base-patched.apk"
          
          if [ ! -f "$APK_PATH" ]; then echo "APK Missing"; exit 1; fi

          ACTIVITY_NAME=$($AAPT2_PATH dump badging "$APK_PATH" | grep "launchable-activity" | sed -n "s/.*name='\([^']\+\)'.*/\1/p")
          echo "activity_name=$ACTIVITY_NAME" >> "$GITHUB_OUTPUT"
          echo "Target Activity: $ACTIVITY_NAME"

      - name: Create Interaction Script
        run: |
          cat << 'EOF' > emulator_script.sh
          #!/bin/bash
          set -e
          PACKAGE_NAME="newway.open.chatgpt.ai.chat.bot.free"
          ACTIVITY="${{ steps.find_activity.outputs.activity_name }}"

          echo "Waiting for boot completion..."
          adb wait-for-device
          for i in {1..60}; do
            BOOT_STATE=$(adb shell getprop sys.boot_completed | tr -d '\r')
            if [ "$BOOT_STATE" == "1" ]; then
              echo "Boot Completed!"
              break
            fi
            sleep 5
          done

          # --- FIX FOR 'SYSTEM UI ISN'T RESPONDING' ---
          echo "Clearing system dialogs (Tapping 'Wait' and Back button)..."
          # Tap roughly where the 'Wait' button appears in your screenshot
          adb shell input tap 500 600 
          sleep 2
          # Press BACK to ensure any other overlays are dismissed
          adb shell input keyevent 4
          sleep 1

          echo "Force-starting the app..."
          # -S force-stops the app before starting to ensure a clean state
          adb shell am start -S -n "$PACKAGE_NAME/$ACTIVITY"
          
          echo "Allowing 20s for app to load..."
          sleep 20

          # --- DEBUG: CHECK WHAT IS ON SCREEN ---
          echo "Current Focused Window:"
          adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp'

          echo "Performing UI automated taps..."
          # Adjust these coordinates if your app's buttons are in different spots
          adb shell input tap 200 800 # Likely 'Dismiss' or 'Skip'
          sleep 3
          
          for i in {1..4}; do
            echo "Tap Continue iteration $i"
            adb shell input tap 500 900 
            sleep 2
          done

          echo "Capturing final state..."
          adb shell screencap /sdcard/screenshot.png
          adb pull /sdcard/screenshot.png ./final_screenshot.png
          
          echo "Challenge script finished."
          EOF
          chmod +x emulator_script.sh

      - name: Run Emulator (High Performance Mode)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          # Increased RAM and added swiftshader for better stability in CI
          emulator-options: "-no-window -no-audio -no-boot-anim -memory 2048 -http-proxy http://127.0.0.1:8080 -gpu swiftshader_indirect"
          disable-animations: true
          script: ./emulator_script.sh

      - name: Upload Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: challenge-results
          path: |
            final_screenshot.png
            network_traffic.mitm
