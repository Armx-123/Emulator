name: Mobile App Interception Challenge

on:
  workflow_dispatch:

jobs:
  run-challenge:
    runs-on: ubuntu-latest 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install mitmproxy
        run: pip install mitmproxy

      - name: Extract Launch Activity
        id: find_activity
        run: |
          BUILD_TOOLS=$(find $ANDROID_SDK_ROOT/build-tools/ -maxdepth 1 -type d | sort -r | head -n 1)
          APK_PATH="./base-patched.apk"
          ACTIVITY_NAME=$("$BUILD_TOOLS/aapt2" dump badging "$APK_PATH" | grep "launchable-activity" | sed -n "s/.*name='\([^']\+\)'.*/\1/p")
          echo "activity_name=$ACTIVITY_NAME" >> "$GITHUB_OUTPUT"

      - name: Create Interaction Script
        run: |
          cat << 'EOF' > emulator_script.sh
          #!/bin/bash
          PACKAGE_NAME="newway.open.chatgpt.ai.chat.bot.free"
          ACTIVITY="${{ steps.find_activity.outputs.activity_name }}"

          echo "Waiting for boot..."
          adb wait-for-device
          until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == "1" ]; do sleep 5; done
          
          # --- SSL CERTIFICATE INJECTION ---
          echo "Generating and Installing mitmproxy Certificate..."
          mitmdump &
          MITM_PID=$!
          sleep 5
          kill $MITM_PID

          # Push cert to device and trigger installation prompt
          adb push ~/.mitmproxy/mitmproxy-ca-cert.cer /sdcard/
          adb shell am start -a android.intent.action.VIEW \
            -d "file:///sdcard/mitmproxy-ca-cert.cer" \
            -t "application/x-x509-ca-cert"
          sleep 3
          # Click 'OK' on the certificate installer (Standard coordinates for API 27)
          adb shell input tap 900 1700 
          
          # Restart proxy for actual capture
          mitmdump -w network_traffic.mitm &
          # ---------------------------------

          echo "Dismissing System UI hang..."
          adb shell input keyevent 4 # The 'Back' button dismisses the unresponsive dialog
          sleep 2

          echo "Launching App: $PACKAGE_NAME"
          adb shell am start -S -n "$PACKAGE_NAME/$ACTIVITY"
          
          echo "Waiting for app load..."
          sleep 25

          echo "Executing UI Interactions..."
          # Dismiss any initial app-level popups
          adb shell input tap 200 800 
          sleep 5
          
          # Loop through the 'Continue' sequence
          for i in {1..4}; do
            echo "Tap iteration $i"
            adb shell input tap 540 1750 # Tapping bottom-center
            sleep 3
          done

          echo "Capturing Results..."
          adb shell screencap -p /sdcard/screenshot.png
          adb pull /sdcard/screenshot.png ./final_screenshot.png
          adb logcat -d > app_debug.log
          EOF
          chmod +x emulator_script.sh

      - name: Run Emulator (Optimized for SSL & RAM)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27
          target: google_apis
          arch: x86
          force-avd-creation: true
          # Keep RAM at 1280 to prevent OOM 137
          emulator-options: >
            -no-window 
            -no-audio 
            -no-boot-anim 
            -memory 1280 
            -http-proxy http://127.0.0.1:8080 
            -gpu swiftshader_indirect
          disable-animations: true
          script: ./emulator_script.sh

      - name: Upload Challenge Evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interception-results
          path: |
            final_screenshot.png
            network_traffic.mitm
            app_debug.log
