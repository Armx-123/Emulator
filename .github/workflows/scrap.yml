name: Mobile App Interception Challenge

on:
  workflow_dispatch:

jobs:
  run-challenge:
    # Ubuntu + KVM is significantly faster and more stable than macOS for Android
    runs-on: ubuntu-latest 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Interception Tools
        run: |
          pip install mitmproxy
          # Start mitmdump in background
          mitmdump -w network_traffic.mitm & 
          echo "Proxy server active on port 8080"

      - name: Extract Launch Activity
        id: find_activity
        run: |
          BUILD_TOOLS=$(find $ANDROID_SDK_ROOT/build-tools/ -maxdepth 1 -type d | sort -r | head -n 1)
          AAPT2_PATH="$BUILD_TOOLS/aapt2"
          APK_PATH="./base-patched.apk"
          
          if [ ! -f "$APK_PATH" ]; then echo "APK Missing"; exit 1; fi

          ACTIVITY_NAME=$($AAPT2_PATH dump badging "$APK_PATH" | grep "launchable-activity" | sed -n "s/.*name='\([^']\+\)'.*/\1/p")
          echo "activity_name=$ACTIVITY_NAME" >> "$GITHUB_OUTPUT"

      - name: Create Interaction Script
        run: |
          cat << 'EOF' > emulator_script.sh
          #!/bin/bash
          set -e
          PACKAGE_NAME="newway.open.chatgpt.ai.chat.bot.free"
          ACTIVITY="${{ steps.find_activity.outputs.activity_name }}"

          echo "Waiting for device to be recognized..."
          adb wait-for-device
          
          echo "Waiting for boot completion (Max 5 mins)..."
          # This loop checks the boot property every 5 seconds
          for i in {1..60}; do
            BOOT_STATE=$(adb shell getprop sys.boot_completed | tr -d '\r')
            if [ "$BOOT_STATE" == "1" ]; then
              echo "Boot Completed!"
              break
            fi
            echo "Still booting... ($i/60)"
            sleep 5
          done

          echo "Dismissing initial system dialogs..."
          adb shell input tap 500 580 
          sleep 2

          echo "Launching App..."
          adb shell am start -n "$PACKAGE_NAME/$ACTIVITY"
          sleep 12 

          echo "Automating UI Taps..."
          adb shell input tap 200 800 # Dismiss
          sleep 2
          for i in {1..4}; do
            adb shell input tap 500 900 # Continue
            sleep 1
          done

          echo "Capturing final state..."
          adb shell screencap /sdcard/screenshot.png
          adb pull /sdcard/screenshot.png ./final_screenshot.png
          EOF
          chmod +x emulator_script.sh

      - name: Run Emulator (KVM Accelerated)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28 # API 28 is often more stable in headless environments
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          # Enable GPU 'swiftshader_indirect' for headless stability
          emulator-options: "-no-window -no-audio -no-boot-anim -camera-back none -http-proxy http://127.0.0.1:8080 -gpu swiftshader_indirect"
          disable-animations: true
          script: ./emulator_script.sh

      - name: Upload Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: challenge-results
          path: |
            final_screenshot.png
            network_traffic.mitm
